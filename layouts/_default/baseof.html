<!DOCTYPE html>
<html lang="id">
<head>
  {{ partial "head.html" . }}
  <!-- Performance optimization: defer Netlify Identity script to prevent blocking HTML parsing and initial render -->
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js" defer></script>
</head>
<body class="bg-white font-body antialiased">
  <a href="#main-content" class="sr-only focus:not-sr-only focus:absolute focus:z-[100] focus:p-4 focus:bg-white focus:text-[#00843D] focus:font-semibold focus:shadow-lg focus:outline-none focus:ring-2 focus:ring-[#00843D] top-2 left-2 rounded-md">
    Lompat ke konten utama
  </a>
  {{ partial "header.html" . }}
  <main id="main-content" tabindex="-1" class="min-h-screen focus:outline-none">
    {{ block "main" . }}{{ end }}
  </main>
  {{/* Performance optimization: Cache static footer partial across all pages to avoid re-evaluating template during site generation */}}
  {{ partialCached "footer.html" . }}
</body>
</html>
