<!DOCTYPE html>
<html lang="id">
<head>
  {{ partial "head.html" . }}
  <!-- Performance optimization: Conditionally load Netlify Identity script only when identity hash is present -->
  <script>
    if (window.location.hash && (window.location.hash.indexOf('access_token=') >= 0 || window.location.hash.indexOf('recovery_token=') >= 0 || window.location.hash.indexOf('invite_token=') >= 0 || window.location.hash.indexOf('confirmation_token=') >= 0)) {
      var script = document.createElement('script');
      script.src = 'https://identity.netlify.com/v1/netlify-identity-widget.js';
      script.defer = true;
      document.head.appendChild(script);
    }
  </script>
</head>
<body class="bg-white font-body antialiased">
  {{ partial "header.html" . }}
  <main class="min-h-screen">
    {{ block "main" . }}{{ end }}
  </main>
  {{/* Performance optimization: Cache static footer partial across all pages to avoid re-evaluating template during site generation */}}
  {{ partialCached "footer.html" . }}
</body>
</html>
