<!DOCTYPE html>
<html lang="id">
<head>
  {{ partial "head.html" . }}
  <!-- Performance optimization: defer Netlify Identity script to prevent blocking HTML parsing and initial render -->
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js" defer></script>
</head>
<body class="bg-white font-body antialiased">
  <a href="#main-content" class="sr-only focus:not-sr-only focus:fixed focus:top-2 focus:left-2 focus:z-[100] focus:px-4 focus:py-2 focus:bg-[#00843D] focus:text-white focus:rounded-lg focus:shadow-lg focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-[#00843D] transition-all">
    Lompati ke konten utama
  </a>
  {{ partial "header.html" . }}
  <main id="main-content" tabindex="-1" class="min-h-screen outline-none">
    {{ block "main" . }}{{ end }}
  </main>
  {{ partial "footer.html" . }}
</body>
</html>
