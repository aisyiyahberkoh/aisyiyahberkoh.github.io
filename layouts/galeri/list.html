{{ define "main" }}
<div class="gradient-hero pt-28 pb-16 px-4">
  <div class="max-w-[1200px] mx-auto">
    <h1 class="text-3xl md:text-5xl font-heading font-bold text-white">{{ .Title }}</h1>
    <p class="text-white/80 text-lg mt-3 max-w-2xl">{{ .Params.description }}</p>
  </div>
</div>
<div class="max-w-[1200px] mx-auto px-4 sm:px-6 lg:px-8 py-12">
  <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4" id="gallery-grid">
    {{ $images := .Resources.ByType "image" }}
    {{ if $images }}
      {{ range $images }}
        <button type="button" aria-label="Lihat foto {{ .Name }}" class="gallery-item w-full cursor-pointer rounded-xl overflow-hidden shadow-md hover:shadow-xl focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[#00843D] focus-visible:ring-offset-2 transition-all duration-300 hover:-translate-y-1 aspect-square">
          <!-- Performance optimization: Add native lazy loading and async decoding -->
          <img src="{{ .RelPermalink }}" alt="" class="w-full h-full object-cover hover:scale-110 transition-transform duration-500" loading="lazy" decoding="async">
        </button>
      {{ end }}
    {{ else }}
      <div class="col-span-full text-center py-20 text-[#6B7280]">
        <svg class="w-16 h-16 mx-auto mb-4 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
        <p class="text-lg font-medium">Belum ada foto</p>
        <p class="text-sm mt-1">Foto akan ditambahkan melalui panel admin</p>
      </div>
    {{ end }}
  </div>
</div>

<script>
(function() {
  const overlay = document.createElement('div');
  overlay.setAttribute('role', 'dialog');
  overlay.setAttribute('aria-modal', 'true');
  overlay.setAttribute('aria-label', 'Pratinjau foto');
  overlay.style.cssText = 'display:none;position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.9);align-items:center;justify-content:center;';

  const img = document.createElement('img');
  img.decoding = 'async';
  img.style.cssText = 'max-width:90vw;max-height:90vh;object-fit:contain;border-radius:8px;box-shadow:0 20px 60px rgba(0,0,0,.5);';

  const closeBtn = document.createElement('button');
  closeBtn.type = 'button';
  closeBtn.setAttribute('aria-label', 'Tutup pratinjau foto');
  closeBtn.innerHTML = '<svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>';
  closeBtn.style.cssText = 'position:absolute;top:20px;right:20px;color:white;background:rgba(255,255,255,0.2);border:none;border-radius:9999px;padding:8px;cursor:pointer;line-height:1;display:flex;align-items:center;justify-content:center;';
  closeBtn.className = 'hover:bg-white/30 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-white';

  const prevBtn = document.createElement('button');
  prevBtn.type = 'button';
  prevBtn.setAttribute('aria-label', 'Foto sebelumnya');
  prevBtn.innerHTML = '<svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>';
  prevBtn.style.cssText = 'position:absolute;left:20px;color:white;background:rgba(255,255,255,0.2);border:none;border-radius:9999px;padding:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;';
  prevBtn.className = 'hover:bg-white/30 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-white';

  const nextBtn = document.createElement('button');
  nextBtn.type = 'button';
  nextBtn.setAttribute('aria-label', 'Foto selanjutnya');
  nextBtn.innerHTML = '<svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>';
  nextBtn.style.cssText = 'position:absolute;right:20px;color:white;background:rgba(255,255,255,0.2);border:none;border-radius:9999px;padding:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;';
  nextBtn.className = 'hover:bg-white/30 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-white';

  overlay.appendChild(prevBtn);
  overlay.appendChild(img);
  overlay.appendChild(nextBtn);
  overlay.appendChild(closeBtn);
  document.body.appendChild(overlay);

  let lastActiveElement = null;
  let items = [];
  let currentIndex = -1;

  function showImage(index) {
    if (index < 0 || index >= items.length) return;
    currentIndex = index;
    const item = items[currentIndex];
    const imgEl = item.querySelector('img');
    if (imgEl) {
      img.src = imgEl.src;
      img.alt = item.getAttribute('aria-label') || '';
    }
  }

  document.getElementById('gallery-grid')?.addEventListener('click', function(e) {
    const item = e.target.closest('.gallery-item');
    if (!item) return;
    items = Array.from(document.querySelectorAll('#gallery-grid .gallery-item'));
    lastActiveElement = item;
    const index = items.indexOf(item);
    showImage(index);
    const navVisible = items.length > 1 ? 'flex' : 'none';
    prevBtn.style.display = navVisible;
    nextBtn.style.display = navVisible;
    overlay.style.display = 'flex';
    document.body.style.overflow = 'hidden';
    closeBtn.focus();
  });

  prevBtn.addEventListener('click', function() {
    showImage((currentIndex - 1 + items.length) % items.length);
  });

  nextBtn.addEventListener('click', function() {
    showImage((currentIndex + 1) % items.length);
  });

  closeBtn.addEventListener('click', closeLightbox);
  overlay.addEventListener('click', function(e) {
    if (e.target === overlay) closeLightbox();
  });

  document.addEventListener('keydown', function(e) {
    if (overlay.style.display !== 'flex') return;
    if (e.key === 'Escape') closeLightbox();
    if (e.key === 'ArrowLeft' && items.length > 1) showImage((currentIndex - 1 + items.length) % items.length);
    if (e.key === 'ArrowRight' && items.length > 1) showImage((currentIndex + 1) % items.length);
    if (e.key === 'Tab') {
      const focusables = items.length > 1 ? [prevBtn, nextBtn, closeBtn] : [closeBtn];
      const idx = focusables.indexOf(document.activeElement);
      if (e.shiftKey) {
        if (idx <= 0) { focusables[focusables.length - 1].focus(); e.preventDefault(); }
      } else {
        if (idx === focusables.length - 1 || idx === -1) { focusables[0].focus(); e.preventDefault(); }
      }
    }
  });

  function closeLightbox() {
    overlay.style.display = 'none';
    document.body.style.overflow = '';
    if (lastActiveElement) {
      lastActiveElement.focus();
    }
  }
})();
</script>
{{ end }}
